[project]
name = "dl-ai-libraries"
version = "1.0.0"
description = "Study and implementation of Python libraries for Deep Learning and Generative AI applications"
requires-python = ">=3.12"
dependencies = [
    "numpy",
    "pandas",
    "matplotlib",
    "opencv-python",
    "scikit-learn",
    "torch",
    "torchvision",
    "tensorflow",
    "transformers",
    "diffusers",
    "accelerate",
    "safetensors",
    "pillow",
    "gensim>=4.4.0",
    "nltk>=3.10.3",
    "spacy>=3.8.16",
    "seaborn>=0.13.2",
]

[dependency-groups]
dev = [
    "ipython>=9.16.1",
]
